# Build, test and package MikMap for Windows, macOS and Linux.
#
#   push a tag v*  -> build + test + package on every OS, attach the packages to a draft release in
#                     duyminh-bostrap/MikMap-releases, then publish it (needs the RELEASES_TOKEN secret, see below)
#   manual "Run"   -> build + test only (nothing is uploaded)
#
# RELEASES_TOKEN: GITHUB_TOKEN can only write to THIS repo, and the releases live in another one. Create a
# fine-grained personal access token limited to MikMap-releases with "Contents: Read and write", and add it under
# Settings > Secrets and variables > Actions > RELEASES_TOKEN.
#
# Packages are uploaded straight to the release by each job instead of passing through workflow artifacts, so this
# does not depend on the account's artifact storage quota.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASES_REPO: duyminh-bostrap/MikMap-releases

jobs:
  draft:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::RELEASES_TOKEN secret is missing (see the comment at the top of this file)"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --draft --title "MikMap $GITHUB_REF_NAME" \
            --notes "MikMap $GITHUB_REF_NAME, built from https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

  build:
    name: ${{ matrix.name }}
    needs: draft
    # run for manual builds too, where `draft` is skipped
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, archive: zip,    installers: "MikMap-Setup.exe" }
          - { name: macos-arm64, os: macos-latest,   archive: tar.gz, installers: "MikMap-Setup.pkg MikMap.dmg" }
          - { name: linux-x64,   os: ubuntu-latest,  archive: tar.gz, installers: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libglfw3-dev xvfb

      - name: Engine tests
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target mikmap_tests -j
          ctest --test-dir build -C Release --output-on-failure

      - name: Build app
        shell: bash
        run: |
          cmake -S src -B src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build src/build --config Release -j

      - name: App test (project round-trip)
        shell: bash
        run: ctest --test-dir src/build -C Release --output-on-failure
      # Linux only: it renders through Xvfb + Mesa software GL. GitHub's Windows and macOS runners have no GPU and
      # no OpenGL 3.x, so the app exits with code 2 when it cannot create its window there; those two are covered by
      # the engine tests, the build and the round-trip test above, not by a render.
      - name: Smoke test (render one frame)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd src/build
          timeout 90 xvfb-run -a ./mikmap --shot smoke.png --size 1440 900 --frames 12
          test -s smoke.png


      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"; [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          DIR="MikMap-${VERSION}-${{ matrix.name }}"
          mkdir "$DIR"
          if [ -f src/build/mikmap.exe ]; then cp src/build/mikmap.exe "$DIR/"; else cp src/build/mikmap "$DIR/"; fi
          cp -r src/build/assets "$DIR/assets"
          cp README.md "$DIR/"
          if [ "${{ matrix.archive }}" = "zip" ]; then 7z a "$DIR.zip" "$DIR" >/dev/null; else tar -czf "$DIR.tar.gz" "$DIR"; fi
          ls -la MikMap-*.*

      # Installers. Names are fixed by the store: MikMap-Setup.exe (Windows), MikMap-Setup.pkg and MikMap.dmg (macOS).
      # Both are unsigned. Built on every run (manual ones too) so a broken installer is caught before a tag.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"; [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.0-dev"
          choco install innosetup --no-progress -y
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$ISCC" "//DAppVersion=${VERSION#v}" "//DSourceDir=$(cygpath -w "$PWD/src/build")" "//DOutDir=$(cygpath -w "$PWD")" installer/windows/mikmap.iss
          ls -la MikMap-Setup.exe

      - name: macOS installers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"; [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.0-dev"
          bash installer/macos/make-installers.sh src/build "$VERSION" "$PWD"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        # The package folder is called MikMap-v0.1.0-<os> and also matches MikMap-*.*, so name the archive extension.
        run: gh release upload "$GITHUB_REF_NAME" MikMap-*.${{ matrix.archive }} ${{ matrix.installers }} --repo "$RELEASES_REPO" --clobber

  publish:
    name: publish
    needs: [draft, build]
    # Publish whatever was built; the notes say which platforms are missing instead of hiding it.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checksums, notes and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          N=$(gh release view "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --json assets --jq '.assets|length')
          if [ "$N" -eq 0 ]; then echo "::error::no package was built, leaving the release as a draft"; exit 1; fi

          # SHA256SUMS.txt: one line per package, "<64 hex>  <file name>" (two spaces), computed from the files as
          # they sit on the release, so the sums describe exactly what users download.
          mkdir dist
          gh release download "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --dir dist --pattern 'MikMap*'
          (cd dist && sha256sum MikMap* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS.txt --repo "$RELEASES_REPO" --clobber

          MISSING=""
          grep -q 'MikMap-Setup\.exe' dist/SHA256SUMS.txt || MISSING="$MISSING windows-x64"
          grep -q 'MikMap-Setup\.pkg' dist/SHA256SUMS.txt || MISSING="$MISSING macos-pkg"
          grep -q 'MikMap\.dmg' dist/SHA256SUMS.txt || MISSING="$MISSING macos-dmg"
          grep -q -- '-linux-x64\.' dist/SHA256SUMS.txt || MISSING="$MISSING linux-x64"
          # Release body: plain Markdown, no images, no HTML. Hand-written notes live in store/release-notes/<tag>.md
          # (optional); otherwise the sections below carry the minimum.
          NOTES_FILE="store/release-notes/$GITHUB_REF_NAME.md"
          {
            if [ -f "$NOTES_FILE" ]; then cat "$NOTES_FILE"; else
              echo "### What's new"; echo; echo "See the commit history for this tag."; echo
              echo "### Fixes"; echo; echo "None recorded for this tag."; echo
              echo "### Known issues"; echo; echo "- No video, NDI, Spout or live sensor input yet; the Sensor I/O page runs on simulated devices."
            fi
            echo; echo "### Installation"; echo
            echo "Windows: run MikMap-Setup.exe. macOS: open MikMap.dmg and drag MikMap to Applications, or run MikMap-Setup.pkg."
            echo "Linux: unpack the .tar.gz and keep the assets folder next to the program. The .zip is a portable Windows build (keep assets next to mikmap.exe)."
            echo "The installers and packages are **not code-signed**: Windows SmartScreen and macOS Gatekeeper will warn on first launch."
            echo "Verify downloads against SHA256SUMS.txt."
            echo; echo "Built from https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
            if [ -n "$MISSING" ]; then echo; echo "Not included in this release (build failed or did not run):$MISSING"; fi
          } > notes.md
          test "$(wc -c < notes.md)" -lt 20000
          gh release edit "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --notes-file notes.md --draft=false
